services:
  - type: web
    name: etidhi-pipeline-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/analytics

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"

      - key: DATABASE_URL
        fromDatabase:
          name: etidhi-pipeline-db
          property: connectionString

databases:
  - name: etidhi-pipeline-db
    plan: free
